<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Course partagée — Splits</title>
<meta name="theme-color" content="#171b1f" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
<style>
  #share-app { max-width:480px; margin:0 auto; padding:24px 20px 40px; }
  #share-map { width:100%; height:220px; border-radius:14px; border:1px solid var(--line); overflow:hidden; margin-top:16px; }
  .share-loading, .share-error { text-align:center; color:var(--ink-faint); padding:60px 20px; font-family:var(--mono); font-size:13px; }
</style>
</head>
<body>
<div id="share-app">
  <div class="topbar" style="padding:0 0 10px;">
    <div class="wordmark"><b>Splits</b> · course partagée</div>
  </div>
  <div id="share-loading" class="share-loading">Chargement…</div>
  <div id="share-content" style="display:none;">
    <div class="detail-title" id="share-date">—</div>
    <div class="detail-hero" id="share-dist">0,00 km</div>
    <div class="stats-grid" style="margin-top:16px;">
      <div class="cell">
        <div class="label">Durée</div>
        <div class="value" id="share-duration">—</div>
      </div>
      <div class="cell">
        <div class="label">Allure moy.</div>
        <div class="value" id="share-pace">—</div>
      </div>
    </div>
    <div id="share-map"></div>
    <div id="share-pace-history" class="pace-history-stack" style="margin-top:20px;"></div>
    <div class="splits-table" id="share-splits" style="margin-top:20px;"></div>
  </div>
  <div id="share-error" class="share-error" style="display:none;">
    Lien invalide, révoqué ou course introuvable.
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";
const SUPABASE_URL = "https://fyuvconzpqglvhufixzv.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_YFi6gTCa6b6i5APTxMT6vg_x06ofpEr";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function fmtKm(m, decimals = 2) { return (m / 1000).toFixed(decimals).replace(".", ","); }
function fmtClock(totalSec) {
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = Math.floor(totalSec % 60);
  if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}
function fmtPace(secPerKm) {
  if (!isFinite(secPerKm) || secPerKm <= 0) return "—'—\"";
  const m = Math.floor(secPerKm / 60);
  const s = Math.round(secPerKm % 60);
  return `${m}'${String(s).padStart(2,"0")}"`;
}
function fmtDateFull(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

// ---------- historique d'allure : barres par répétition ET/OU courbe continue
// recollée (portage de la logique de app.js, empilées quand les deux existent) ----------
function computePhaseAvgPace(phaseLog, finalElapsedSec, finalDistanceM) {
  const entries = [];
  for (let i = 0; i < phaseLog.length; i++) {
    const cur = phaseLog[i];
    const next = phaseLog[i + 1];
    const endT = next ? next.t : finalElapsedSec;
    const endDist = next ? next.distanceM : finalDistanceM;
    const durSec = Math.max(1, endT - cur.t);
    const distM = Math.max(0, endDist - cur.distanceM);
    const avgPaceSecPerKm = distM > 5 ? durSec / (distM / 1000) : null;
    entries.push({ ...cur, durationSec: durSec, avgPaceSecPerKm });
  }
  return entries;
}
function buildContinuSegments(phaseLog, paceHistory, finalElapsedSec) {
  if (!phaseLog || !phaseLog.length || !paceHistory || !paceHistory.length) return [];
  const segments = [];
  for (let i = 0; i < phaseLog.length; i++) {
    if (phaseLog[i].kind !== "continu") continue;
    const startT = phaseLog[i].t;
    const endT = i + 1 < phaseLog.length ? phaseLog[i + 1].t : finalElapsedSec;
    const samples = paceHistory.filter((p) => p.t >= startT && p.t < endT);
    if (samples.length > 1) segments.push(samples);
  }
  return segments;
}
function concatSegments(segments) {
  const combined = [];
  const boundaries = [];
  let offset = 0;
  segments.forEach((seg) => {
    const segStart = seg[0].t;
    seg.forEach((p) => combined.push({ t: offset + (p.t - segStart), pace: p.pace }));
    const segDuration = seg[seg.length - 1].t - segStart;
    offset += segDuration + 1;
    boundaries.push(offset - 0.5);
  });
  boundaries.pop();
  return { combined, boundaries };
}
function renderPaceLineChart(el, paceHistory, boundaries) {
  if (!paceHistory || paceHistory.length < 2) return false;
  const paces = paceHistory.map((p) => p.pace);
  const minPace = Math.min(...paces);
  const maxPace = Math.max(...paces);
  const range = Math.max(maxPace - minPace, 1);
  const maxT = Math.max(paceHistory[paceHistory.length - 1].t, 1);
  const W = 300, H = 90, pad = 4;
  const points = paceHistory.map((p) => {
    const x = pad + (p.t / maxT) * (W - 2 * pad);
    const yNorm = (maxPace - p.pace) / range;
    const y = pad + (1 - yNorm) * (H - 2 * pad);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const separators = (boundaries || []).map((t) => {
    const x = pad + (t / maxT) * (W - 2 * pad);
    return `<line x1="${x.toFixed(1)}" y1="${pad}" x2="${x.toFixed(1)}" y2="${H - pad}" stroke="#6d7880" stroke-width="1" stroke-dasharray="3,3" vector-effect="non-scaling-stroke" />`;
  }).join("");
  el.innerHTML = `
    <div class="pace-chart-label">Allure dans le temps</div>
    <div class="pace-chart-range-top"><span>${fmtPace(minPace)}/km</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="pace-chart-svg" preserveAspectRatio="none">
      ${separators}
      <polyline points="${points}" fill="none" stroke="#d6432e" stroke-width="2" vector-effect="non-scaling-stroke" />
    </svg>
    <div class="pace-chart-range-bottom"><span>${fmtPace(maxPace)}/km</span></div>
  `;
  return true;
}
function renderRepsBarChart(el, entries) {
  const workEntries = entries.filter((e) => e.kind === "work" && e.avgPaceSecPerKm);
  if (workEntries.length === 0) return false;
  const paces = workEntries.map((e) => e.avgPaceSecPerKm);
  const maxPace = Math.max(...paces);
  const minPace = Math.min(...paces);
  const range = Math.max(maxPace - minPace, 1);
  el.innerHTML = `<div class="pace-chart-label">Allure par répétition</div><div class="trends-bars reps-bars"></div>`;
  const barsEl = el.querySelector(".reps-bars");
  workEntries.forEach((e) => {
    const pct = Math.max(4, 35 + (65 * (maxPace - e.avgPaceSecPerKm)) / range);
    const bar = document.createElement("div");
    bar.className = "trend-bar";
    bar.innerHTML = `
      <div class="trend-bar-val">${fmtPace(e.avgPaceSecPerKm)}</div>
      <div class="trend-bar-track"><div class="trend-bar-fill" style="height:${pct}%"></div></div>
      <div class="trend-bar-label">${e.rep || ""}${e.totalSets > 1 ? ` S${e.set}` : ""}</div>
    `;
    barsEl.appendChild(bar);
  });
  return true;
}
function renderSharePaceHistory(row) {
  const stack = document.getElementById("share-pace-history");
  stack.innerHTML = "";
  let shown = false;

  if (row.has_repetitions && row.phase_log && row.phase_log.length > 0) {
    const entries = computePhaseAvgPace(row.phase_log, row.duration_sec, row.distance_m);
    const repsEl = document.createElement("div");
    repsEl.className = "pace-history-block";
    if (renderRepsBarChart(repsEl, entries)) { stack.appendChild(repsEl); shown = true; }

    const segments = buildContinuSegments(row.phase_log, row.pace_history, row.duration_sec);
    if (segments.length > 0) {
      const { combined, boundaries } = concatSegments(segments);
      const continuEl = document.createElement("div");
      continuEl.className = "pace-history-block";
      if (renderPaceLineChart(continuEl, combined, boundaries)) { stack.appendChild(continuEl); shown = true; }
    }
  } else if (row.pace_history && row.pace_history.length > 1) {
    const el = document.createElement("div");
    el.className = "pace-history-block";
    if (renderPaceLineChart(el, row.pace_history, [])) { stack.appendChild(el); shown = true; }
  }

  stack.classList.toggle("show", shown);
}

async function loadSharedRun() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");
  const token = params.get("t");
  if (!id || !token) return showError();

  const { data, error } = await sb.rpc("get_shared_run", { p_id: id, p_token: token });
  if (error || !data || data.length === 0) return showError();

  const row = data[0];
  document.getElementById("share-loading").style.display = "none";
  document.getElementById("share-content").style.display = "block";
  document.getElementById("share-date").textContent = fmtDateFull(row.date);
  document.getElementById("share-dist").textContent = `${fmtKm(row.distance_m)} km`;
  document.getElementById("share-duration").textContent = fmtClock(row.duration_sec);
  document.getElementById("share-pace").textContent = `${fmtPace(row.avg_pace_sec_per_km)} /km`;

  renderSharePaceHistory(row);

  const path = row.path || [];
  if (path.length > 1) {
    const map = L.map("share-map", { zoomControl: false, attributionControl: false }).setView([path[0].lat, path[0].lng], 15);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
    const latlngs = path.map((p) => [p.lat, p.lng]);
    const line = L.polyline(latlngs, { color: "#d6432e", weight: 4 }).addTo(map);
    map.fitBounds(line.getBounds(), { padding: [16, 16] });
  } else {
    document.getElementById("share-map").outerHTML = `<div class="empty-state" style="margin-top:16px;">Pas de tracé GPS pour cette course.</div>`;
  }

  const splitsEl = document.getElementById("share-splits");
  const splits = row.splits || [];
  const maxPace = Math.max(...splits.map((s) => s.seconds), 1);
  const minPace = Math.min(...splits.map((s) => s.seconds), maxPace);
  splits.forEach((s) => {
    const range = Math.max(maxPace - minPace, 1);
    const pct = 35 + (65 * (maxPace - s.seconds)) / range;
    const row2 = document.createElement("div");
    row2.className = "split-row";
    row2.innerHTML = `
      <div class="km-idx">${s.km}</div>
      <div class="split-bar-track"><div class="split-bar-fill" style="width:${pct}%"></div></div>
      <div class="pace-val">${fmtPace(s.seconds)}</div>
    `;
    splitsEl.appendChild(row2);
  });
}
function showError() {
  document.getElementById("share-loading").style.display = "none";
  document.getElementById("share-error").style.display = "block";
}
loadSharedRun();
</script>
</body>
</html>
